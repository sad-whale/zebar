[package]
name = "zebar-native"
version = "3.3.1-3"
edition = "2021"
license = "GPL-3.0-only"
description = "Native AppKit status bar for GlazeWM"

[dependencies]
anyhow = "1"
futures-util = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = "0.26"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
libc = "0.2"
netdev = "0.33"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSButton", "NSCell", "NSColor", "NSControl", "NSEvent", "NSFont", "NSFontDescriptor", "NSGraphics", "NSImage", "NSPanel", "NSParagraphStyle", "NSResponder", "NSRunningApplication", "NSScreen", "NSText", "NSTextField", "NSView", "NSWindow", "NSWorkspace", "objc2-quartz-core", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSEnumerator", "NSGeometry", "NSNotification", "NSObject", "NSString", "NSThread"] }
starship-battery = "0.8"
sysinfo = "0.30"

objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "objc2-core-foundation", "objc2-core-graphics"] }
